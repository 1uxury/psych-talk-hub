name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: psychtalk_ci
          POSTGRES_PASSWORD: ci-only-isolated-password
          POSTGRES_DB: psych_talk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ENV: test
      SECRET_KEY: ci-only-key-for-an-ephemeral-run-not-a-production-secret-2026
      DATABASE_URL: postgresql://psychtalk_ci:ci-only-isolated-password@127.0.0.1:5432/psych_talk_ci
      TEST_DATABASE_NAME: test_psychtalk_ci
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Django system checks
        run: python manage.py check --database default
      - name: Apply base migrations
        run: python manage.py migrate --noinput
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Test with isolated PostgreSQL database
        run: python manage.py test --noinput
